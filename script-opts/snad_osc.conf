# snad-osc configuration file by snad
# https://github.com/thisisshihan/mpv-player-config-snad

# ===== LAYOUT (read at startup, restart mpv after changing) =====
layout=center                   	# streamer | pill | center | default   (default = mpv's own OSC, configured in osc.conf)

# ===== GENERAL =====
scale=0.80                      	# overall UI size multiplier
accent=FF0000                   	# accent colour for progress bar / active icons (RRGGBB) / 1E9BE9
font=Segoe UI                   	# UI font
symbol_font=Segoe UI Symbol     	# font used for the loop symbol
via=mpv                         	# text after "via" in the info line
use_12h=no                      	# 4:58 pm clock (false = 16:58)
skip_seconds=10                 	# back/forward button step
hide_timeout=3                  	# seconds of inactivity before the UI hides
click_to_pause=no               	# click on the video (not on a control) toggles pause
idle_logo=no                     	# empty player: show mpv's own logo (needs osc=yes in mpv.conf)
thumbfast=yes                   	# use the thumbfast script for hover thumbnails if present
show_layout_hint=no             	# show "snad-osc vX  layout: name" on screen when a file starts (for troubleshooting)

# ===== CONTROL BUTTONS =====
show_chapter_buttons=yes        	# previous / next CHAPTER buttons (|< >| icons) next to the playlist buttons (single triangle)
loop_playlist=yes               	# loop button cycles: off -> this file (1) -> whole playlist (∞) -> off  (no = file loop only)
show_info_button=yes            	# media info card button (video / audio / file details) in the right-hand button group
volume_style=vertical           	# vertical = click the speaker to open a vertical slider popup | horizontal = inline slider
hide_buttons=                   	# buttons to hide, comma separated: play prev next chprev chnext back fwd volume time clock info tracks loop playlist fullscreen pin min max close  (window = all four window buttons)
disabled_color=6B7078           	# colour of a button that cannot be used (no chapters / no playlist)
active_style=fill               	# look of a toggled-on button (tracks/loop/playlist/fullscreen/volume): border | fill | both | none
active_fill=glass               	# fill for active_style=fill|both: dark | glass | darkglass
active_fill_color=              	# fill colour (RRGGBB); empty = taken from active_fill
active_fill_opacity=-1          	# fill opacity 0..1; -1 = taken from active_fill
highlight_active=no             	# accent-colour the tracks/loop icons when subtitles, non-1x speed or loop are active

# ===== TITLE, INFO PILLS & CLOCK POSITION =====
show_playlist_pos=yes           	# [02/10] next to the title when the playlist has several items
title_two_lines=yes              	# a title that is too long wraps onto a second line instead of shrinking / being cut (streamer + center layouts)
title_pinned=no                 	# keep the top-left title/path (with [02/10]) visible when controls hide (click it to toggle)
seek_lift=10                    	# raise title + info pills + seek bar this many px above the buttons (streamer/center layouts; try 20-40)
info_lift=10                     	# raise ONLY the title + info pills this many px (streamer/center layouts)
center_pills_below=yes           	# center layout: info pills on their own row BELOW the title, left aligned
sub_lift=22                     	# raise subtitles by this % of window height while controls show (0 = off)
show_clock=yes                  	# clock + "Ends at" (top right)
clock_pinned=no                 	# keep clock + "Ends at" visible when controls hide (click the clock to toggle)

# ===== TIME LABEL =====
time_pill=no                    	# filled pill behind the time label
time_pill_style=darkglass       	# dark | glass | darkglass | accent (follows accent=)
time_pill_color=                	# RRGGBB; empty = taken from the style
time_pill_opacity=-1            	# 0..1; -1 = taken from the style

# ===== WINDOW CONTROLS & FRAME =====
show_window_controls=yes        	# pin / minimize / maximize / close group
show_audio_button=yes          		# "audio only" switch (note icon) in the window-control group for video files: shows the audio skin instead of the picture, no resize. Key binding: script-binding snad-osc/toggle-audio-only  (hide with hide_buttons=audioonly)
winctl_color=FFFFFF             	# background of the pin / minimize / maximize / close group (RRGGBB)
winctl_opacity=0.22             	# 0 = no background, 1 = solid
native_border=no                	# no = the script sets border=no (frameless window; use the OSC window buttons). yes = keep the OS title bar
window_corners=default          	# Windows 11 corners, set through the OS (DWM) like a normal window: default (leave as is) | round | small | none
win_border=0                    	# thin border line width in px (0 = off); follows the corner style above
win_border_color=FFFFFF         	# border line colour (RRGGBB)
win_border_opacity=0.35         	# border line opacity 0..1

# ===== SEEK BAR =====
seek_wave=yes                   	# Android-style animated wavy seek bar
wave_style=fill                 	# fill = layered translucent humps over a white line (Android look) | line = single wavy line
wave_opacity=0.65               	# hump opacity (fill style)
wave_baseline=accent            	# line under the humps: accent = follow accent= | RRGGBB | empty = gradient
wave_follow_accent=no           	# yes = the wave uses shades of accent= (wave_colors below is ignored); no = use wave_colors
wave_colors=3B9DFF,9B5CF6,FF3B5C	# gradient along the played part (comma-separated RRGGBB; one colour = solid)
wave_amplitude=15               	# wave height
wave_length=130                 	# distance between crests
wave_speed=1.5                  	# travel speed (0 = still)
wave_fps=20                     	# animation smoothness; lower = lighter on weak PCs
wave_thickness=3.5              	# line thickness
wave_flat_when_paused=yes       	# straight line while paused

# ===== SEEK TOOLTIP =====
tip_position=below              	# seek hover time tooltip: above | below the seek bar (thumbnails always go above)
tip_gap=4                       	# distance between the seek bar and the tooltip
tip_font_size=12                	# seek hover tooltip: time text size
tip_height=18                   	# tooltip height (+14 when a chapter name is shown)
tip_color=FFFFFF                	# tooltip fill colour (RRGGBB)
tip_opacity=0.22                	# tooltip fill opacity 0..1
tip_text_color=FFFFFF           	# tooltip text colour
tip_shadow=no                   	# text shadow in the tooltip

# ===== AUDIO SKIN (files with no real video: music, podcasts; cover art is shown in the card) =====
audio_layout=card               	# card = "Now Playing" card available | off = audio skin removed completely (also hides the note button on audio files)
audio_default=no	              	# yes = audio files open in the audio skin | no = they open in the normal layout (the note button in the window controls switches the skin on / off)
audio_fit_window=yes            	# audio files: crop a taller-than-16:9 window down to 16:9 when playback starts (Windows only)
audio_cover_pos=left            	# left = always the card layout (default) | center = stacked layout, opt-in only
audio_scale=1.0                 	# size multiplier of the audio skin
audio_bg=0A0C12                 	# background colour (RRGGBB); also the colour outside the rounded cover
audio_glow=yes                  	# soft accent glow behind the cover
audio_glow_color=cover          	# cover = glow colours taken from the album art (grey / black&white art keeps the accent + blue) | accent

# ===== INFO PILLS =====
pill_font_size=12               	# text size (before the global scale)
pill_height=17                  	# pill height
pill_padding=8                  	# left/right padding inside the pill
pill_gap=5                      	# space between pills
pill_bold=yes                   	# bold pill text
pill_color=FFFFFF               	# fill colour (RRGGBB)
pill_opacity=0.22               	# fill opacity: 0 = invisible, 1 = solid
pill_text_color=FFFFFF          	# text colour (use a dark colour with a high pill_opacity)
pill_text_opacity=1             	# text opacity 0..1
pill_border_width=0             	# outline thickness, 0 = none
pill_border_color=FFFFFF        	# outline colour (RRGGBB)
pill_border_opacity=0.6         	# outline opacity 0..1
pill_fps_round=yes              	# round the frame rate: 23.976 -> 24, 29.97 -> 30, 59.94 -> 60 (no = exact)
pill_show_fps=yes               	# frame rate pill (24 fps / 29.97 fps / 60 fps)
pill_show_resolution=yes        	# 1080p / 4K ...
pill_show_hdr=yes               	# HDR10 / Dolby Vision / Atmos
pill_show_vcodec=yes            	# video codec (H.264, HEVC, AV1 ...)
pill_show_audio=yes             	# audio language + channels
pill_show_acodec=yes            	# audio codec (AAC, E-AC-3, DTS ...)
pill_show_subtitle=yes          	# currently selected subtitle track
pill_show_speed=yes             	# only shown when speed is not 1x
pill_show_loop=yes              	# only shown when loop is on
pill_show_chapter=no	           	# chapter pill (streamer layout)

# ===== PANELS (tracks menu, playlist/chapters drawer, volume popup, media info card) =====
exclusive_panels=yes            	# only one panel open at a time (tracks menu / playlist drawer / info card / volume popup / right-click menu)
panel_scale=0.95                	# geometry scale of the panels; 1 = original size, 0.7 = compact
panel_round_rows=yes            	# pill-shaped rows and round number badges in the menus / playlist drawer (no = soft squares)
panel_row_height=38             	# height of track / playlist / chapter rows
panel_pill_height=26            	# speed chips, tabs and +/- delay buttons
panel_text_shadow=yes           	# text shadow inside the panels
drawer_width=0                  	# playlist drawer width in px (before scale); 0 = automatic
drawer_width_pct=50              	# playlist drawer width as % of the window width (e.g. 40); 0 = off, wins over drawer_width
panel_style_all=no              	# yes = window controls, info pills and seek tooltip share the panel look below (style/colour/opacity/blur)
panel_style=darkglass           	# dark | glass (white, see-through) | darkglass (dark, see-through)
panel_color=                    	# background colour (RRGGBB); empty = taken from panel_style
panel_opacity=-1                	# background opacity 0..1; -1 = taken from panel_style
panel_blur=yes                  	# EXPERIMENTAL: blur the video behind panels (vo=gpu/gpu-next only)
panel_blur_radius=20            	# blur strength in pixels
panel_blur_taps=6               	# blur quality: 16 fast ... 48 smooth (more = heavier on the GPU)

# ===== HISTORY (third tab in the playlist drawer; for mpv's own history add  save-watch-history=yes  to mpv.conf) =====
history=yes                     	# recently played files, kept between sessions
history_source=auto             	# auto = mpv's own watch history when save-watch-history=yes is in mpv.conf, else this script's own list | mpv | own
history_max=50                  	# how many entries to keep
history_resume=yes              	# own list only: picking an entry resumes where you stopped
history_file=~~/snad-osc-history.json	# where the list is saved (~~/ = your mpv config folder; delete the file to clear)

# ===== CONTEXT MENU (right-click) =====
context_menu=yes                	# yes = right-click opens the themed menu, no = keep mpv's native menu
ctx_font_size=13                	# context menu text size
ctx_row_height=28               	# context menu row height
ctx_history=yes                 	# the menu's "History" entry opens a list of recent files
ctx_history_items=12            	# how many recent files it lists
ctx_shortcuts=no                	# show key bindings on the right side
ctx_shortcut_keys=2             	# max key bindings shown per entry
ctx_min_width=150               	# narrowest menu panel
ctx_max_width=250               	# widest menu panel (longer titles are cut with ...)
ctx_hide=                       	# entries to remove, comma separated, case-insensitive. A name removes it anywhere; Parent/Child removes one entry. e.g. ctx_hide=Stop, Quit and save position, Window/Stay on top

# ===== INDICATORS (volume, mute, speed, seek, sub/audio delay, brightness...) =====
ind_enabled=yes                 	# master switch for the volume/seek/speed/... indicator pills
ind_hide_native_osd=yes         	# set osd-level=0 so mpv's own volume/seek text is not shown as well
ind_position=top                	# top | bottom
ind_margin=80                   	# distance from the screen edge
ind_scale=1.2                   	# indicator size
ind_duration=1.2                	# seconds visible
ind_fade=0.25                   	# fade-out seconds (0 = instant)
ind_accent=                     	# slider fill colour (RRGGBB); empty = use the main accent above
ind_style=glass                 	# dark | glass (white, see-through) | darkglass (dark, see-through); empty = same as panel_style
ind_panel_color=                	# pill colour (RRGGBB); empty = taken from the style
ind_panel_opacity=-1            	# 0 clear .. 1 solid; -1 = taken from the style
ind_border=yes                  	# thin light edge
ind_shadow=yes                  	# soft drop shadow
ind_font=                       	# empty = default font
ind_font_size=13
ind_bar_width=110               	# slider length
ind_delay_buttons=yes           	# small - / + discs on the delay pills
ind_seek_min=1.0                	# ignore seek jumps smaller than this (seconds)
ind_show_volume=yes
ind_show_mute=yes
ind_show_speed=yes
ind_show_seek=yes
ind_show_sub_delay=yes
ind_show_audio_delay=yes
ind_show_picture=yes            	# brightness / contrast / gamma / saturation / hue
